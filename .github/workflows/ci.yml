name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    name: build and verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # MP4 encoding currently runs through Media Foundation, so the verify
        # step is a Windows gate until another encoder backend lands.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install
      - run: pnpm run build
      - run: node packages/open-cut/dist/cli.js verify films/design-tokens.ts --json
