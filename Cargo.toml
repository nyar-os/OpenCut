[workspace]
resolver = "2"
members = ["crates/napi"]
default-members = ["crates/napi"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenCut Authors"]
repository = "https://github.com/nyar-os/OpenCut"

[workspace.dependencies]
serde_json = "1"
# Cross-repo git dependencies must pin the full 40-character revision.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "66f5d003fec85e28503968fd0a6a271beef0f389" }
# The renderer lives upstream. Local development resolves it by path; once the
# upstream tree is published the dependency becomes a pinned git revision:
# media = { git = "https://github.com/muse-gpt/ucf.rs.git", rev = "<40-hex>" }
media = { path = "../../多媒体研究/media.rs/projects/media/media" }

[profile.release]
lto = true
panic = "abort"
