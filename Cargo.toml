[workspace]
resolver = "2"
members = ["crates/core", "crates/napi"]
default-members = ["crates/core", "crates/napi"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenCut Authors"]
repository = "https://github.com/nyar-os/OpenCut"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdue = "0.9"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
] }
# Cross-repo git dependencies must pin the full 40-character revision.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "66f5d003fec85e28503968fd0a6a271beef0f389" }
opencut-core = { path = "crates/core" }

[profile.release]
lto = true
panic = "abort"
