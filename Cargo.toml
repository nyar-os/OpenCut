[workspace]
resolver = "2"
members = ["crates/napi"]
default-members = ["crates/napi"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["OpenCut Authors"]
repository = "https://github.com/nyar-os/OpenCut"

[workspace.dependencies]
serde_json = "1"
# Cross-repo git dependencies must pin the full 40-character revision.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "66f5d003fec85e28503968fd0a6a271beef0f389" }
# The renderer lives upstream. The revision is pinned to a full 40-character
# commit so any checkout resolves the exact same source; bump it deliberately.
media = { git = "https://github.com/oovm/boost.rs.git", rev = "2e70f3d1f1ba6e444c78fc3b78cda72f0eec9986" }

[profile.release]
lto = true
panic = "abort"

